<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cultura — Cultural Team Portal</title>
<link rel="icon" type="image/x-icon" href="../source/icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#8d3d28 0,#35231c 45%,#171411 100%)}
.login-card{width:min(430px,100%);background:var(--paper);color:var(--ink);border-radius:24px;padding:38px;box-shadow:0 25px 80px #0007}.logo{font-weight:800;letter-spacing:4px}.logo span{color:#9a432c}
.login h1{font-family:Georgia,serif;font-size:42px;margin:28px 0 8px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}
.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:12px;border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#211f1c;color:white;font-weight:700}
.btn.accent{background:#93432c}.btn.light{background:var(--soft);color:var(--ink)}.btn.danger{background:#9b352c}.full{width:100%}.demo{background:var(--soft);padding:12px;border-radius:10px;font-size:13px;margin-top:15px}
.app{min-height:100vh}.top{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;z-index:20}.top nav{display:flex;gap:8px;align-items:center}
.top nav button{border:0;background:transparent;padding:10px;border-radius:9px;color:var(--ink)}.top nav button:hover{background:var(--soft)}.avatar{width:38px;height:38px;border-radius:50%;background:#93432c;color:white;display:grid;place-items:center;font-weight:800}
.shell{display:flex;max-width:1400px;margin:auto}.side{width:245px;padding:22px 15px;min-height:calc(100vh - 72px);border-right:1px solid var(--line)}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;margin:3px 0;color:var(--ink)}
.side button:hover{background:var(--soft)}.main{flex:1;padding:35px;min-width:0}.hero h1{font:700 clamp(38px,5vw,62px) Georgia,serif;margin:0 0 10px}.eyebrow{font-size:11px;letter-spacing:2px;color:#93432c;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px}
.stat strong{font:700 38px Georgia,serif;display:block}.stat span{color:var(--muted)}.section{margin-top:28px}.section h2{font:600 30px Georgia,serif}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--soft);font-size:12px}
.green{background:#dcebdc;color:#2d6737}.red{background:#f2d9d5;color:#8e3028}.yellow{background:#f5e8bf;color:#795b15}.event{display:flex;gap:15px}.date{min-width:62px;text-align:center;background:#f0e3d4;color:#211f1c;border-radius:12px;padding:10px;font-weight:800}
.chat{height:65vh;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:10px}.msg{padding:11px 0;border-bottom:1px solid var(--line)}.msg small{color:var(--muted);margin-left:8px}.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}.composer input{flex:1}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:20px}.modal-card{background:var(--paper);color:var(--ink);width:min(550px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:25px}.close{float:right;border:0;background:var(--soft);color:var(--ink);padding:7px 10px;border-radius:8px}
.notice{padding:14px;border-radius:12px;background:var(--soft);margin:10px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:80px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.mobile-menu{display:none}@media(max-width:900px){.side{display:none}.main{padding:22px 16px}.grid,.grid2{grid-template-columns:1fr}.mobile-menu{display:block}.calendar{grid-template-columns:repeat(2,1fr)}}
.toast{position:fixed;right:20px;bottom:20px;background:#211f1c;color:#fff;padding:14px 18px;border-radius:10px;z-index:100}

/* --- Professional admin UI upgrade --- */
:root{--bg:#f5f1e9;--ink:#211f1c;--muted:#817a72;--paper:#fffdf9;--paper2:#faf5ee;--line:#e1d8cb;--accent:#93432c;--accent2:#b86143;--soft:#f0e6d9;--shadow:#4b392b0a}
[data-theme="dark"]{--bg:#15130f;--ink:#efe9df;--muted:#a89d8e;--paper:#221e19;--paper2:#2a2520;--line:#3c352c;--accent:#c4694a;--accent2:#d98567;--soft:#332c24;--shadow:#0007}
html{background:var(--bg)}
body,.card,.modal-card,.login-card,.top,.doc-card{transition:background .2s,color .2s,border-color .2s}
.theme-toggle{border:1px solid var(--line);background:var(--paper);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:16px;padding:0}
.top{box-shadow:0 2px 18px #00000008}.side{background:linear-gradient(180deg,var(--paper),var(--paper2))}
.btn{transition:.18s transform,.18s box-shadow,.18s background}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px #0002}.btn.sm{padding:8px 11px;font-size:13px}.btn.success{background:#3c7650}.btn.warn{background:#b47b19}
.card{box-shadow:0 4px 18px var(--shadow)}.hero{margin-bottom:22px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.toolbar .search{max-width:360px}.table th{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);background:var(--paper2)}.table tr:hover td{background:var(--paper2)}.member-card{display:flex;align-items:center;gap:14px}.member-avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#ead8ca;color:#7d3825;font-weight:800;font-size:17px}.member-meta{min-width:0}.member-meta strong{display:block}.member-meta small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis}.action-row{display:flex;gap:7px;flex-wrap:wrap}.calendar-year{margin-top:22px}.calendar-year h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font:600 28px Georgia,serif}.months-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.month-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 4px 14px var(--shadow)}.month-title{font-weight:800;margin-bottom:9px}.month-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.month-week span{font-size:9px;text-align:center;color:var(--muted);font-weight:800}.month-day{min-height:31px;border:1px solid transparent;border-radius:7px;padding:4px;font-size:10px;position:relative}.month-day.has-event{background:#f3e1d3;color:#211f1c;border-color:#e4c6b4}.month-day .event-dot{display:block;width:5px;height:5px;border-radius:50%;background:#93432c;margin-top:2px}.month-day.empty{visibility:hidden}.month-day:hover{border-color:#cfae9b}.calendar-legend{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;margin-top:10px}.attendance-shell{display:flex;flex-direction:column;gap:6px}.att-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}.att-row{display:grid;grid-template-columns:minmax(180px,1fr) 220px 90px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.att-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.att-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 5px;border-radius:9px;font-weight:700;font-size:12px}.att-btn.active.present{background:#dcebdc;border-color:#9cc2a0;color:#2d6737}.att-btn.active.late{background:#f5e8bf;border-color:#d9bd6a;color:#795b15}.att-btn.active.absent{background:#f2d9d5;border-color:#d5a39c;color:#8e3028}.att-row .percent{text-align:right}.calendar-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.calendar-controls select{width:auto}.competition-form{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}.competition-form .full-field{grid-column:1/-1}.modal-card.wide{width:min(760px,100%)}
@media(max-width:1100px){.months-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.months-grid{grid-template-columns:repeat(2,1fr)}.att-row{grid-template-columns:1fr}.att-row .percent{text-align:left}.competition-form{grid-template-columns:1fr}}
@media(max-width:560px){.months-grid{grid-template-columns:1fr}.calendar-year h2{font-size:23px}}

/* --- Registration + documents + alumni --- */
.login-card{max-height:94vh;overflow:auto}
.auth-tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:12px;margin-top:20px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--muted)}
.auth-tabs button.active{background:#211f1c;color:#fff}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
@media(max-width:520px){.two-col{grid-template-columns:1fr}}
.doc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:700px){.doc-grid{grid-template-columns:1fr}}
.doc-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper)}
.doc-card h3{margin:0 0 4px;font-size:16px}
.doc-card .doc-status{font-size:12px;color:var(--muted);margin-bottom:10px}
.doc-card .doc-status.ok{color:#2d6737;font-weight:700}
.doc-card input[type=file]{width:100%;margin-bottom:10px}
.alumni-card{display:flex;gap:14px;align-items:flex-start}
.alumni-avatar{width:52px;height:52px;border-radius:50%;background:#ead8ca;color:#7d3825;display:grid;place-items:center;font-weight:800;font-size:20px;flex-shrink:0;overflow:hidden}
.alumni-avatar img{width:100%;height:100%;object-fit:cover}
.member-detail dt{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:12px}
.member-detail dd{margin:2px 0 0;font-weight:600}
</style>
</head>
<body>
<div id="loginScreen" class="login">
<div class="login-card">
<div style="display:flex;justify-content:space-between;align-items:center"><div class="logo">CULTURA <span>TEAM</span></div><button class="theme-toggle" id="themeToggleLogin" onclick="toggleTheme()" title="Toggle day/night mode" type="button">🌙</button></div>
<div class="auth-tabs"><button id="tabLoginBtn" class="active" onclick="setAuthTab('login')" type="button">Login</button><button id="tabRegisterBtn" onclick="setAuthTab('register')" type="button">Register</button></div>
<form id="loginForm">
<h1>Welcome back.</h1>
<p class="muted">Sign in to access your cultural team portal.</p>
<label class="field">College email<input id="loginEmail" type="email" required></label>
<label class="field">Password<input id="loginPassword" type="password" required></label>
<button class="btn accent full">Login →</button>
<p class="muted" style="margin-top:14px;font-size:13px">New here? <a href="#" onclick="setAuthTab('register');return false">Register first</a> to create your account.</p>
</form>
<form id="registerForm" class="hidden">
<h1>Create your account.</h1>
<p class="muted">You must register before you can log in. Fill in your details below.</p>
<div class="two-col">
<label class="field">Full name<input id="regName" required></label>
<label class="field">Gender<select id="regGender" required><option value="">Select…</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></label>
<label class="field">Father's name<input id="regFather" required></label>
<label class="field">Mother's name<input id="regMother" required></label>
<label class="field">Course name<input id="regCourse" placeholder="e.g. B.Tech Computer Science" required></label>
<label class="field">Roll number<input id="regRoll" required></label>
<label class="field">Contact number<input id="regContact" type="tel" required></label>
<label class="field">Date of birth<input id="regDob" type="date" required></label>
<label class="field full-field" style="grid-column:1/-1">College email ID<input id="regEmail" type="email" required></label>
<label class="field">Password<input id="regPassword" type="password" required minlength="6"></label>
<label class="field">Confirm password<input id="regPassword2" type="password" required minlength="6"></label>
</div>
<button class="btn accent full" style="margin-top:10px">Register →</button>
<p class="muted" style="margin-top:14px;font-size:13px">Already registered? <a href="#" onclick="setAuthTab('login');return false">Login here</a>.</p>
</form>
</div></div>
<div id="app" class="app hidden">
<header class="top"><div class="logo">CULTURA <span>TEAM</span></div><nav><button onclick="showPage('home')">Home</button><button onclick="showPage('calendar')">Calendar</button><button onclick="showPage('profile')">Profile</button><button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle day/night mode" type="button">🌙</button><div class="avatar" id="avatar">C</div><button onclick="logout()">Logout</button></nav></header>
<div class="shell"><aside class="side" id="sidebar"></aside><main class="main" id="main"></main></div></div>
<div id="modal" class="modal hidden"><div id="modalCard" class="modal-card"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const API = location.hostname === 'localhost' ? 'http://localhost:4000/api' : '/api';
let token=localStorage.getItem('cultura_token'), current=null;

async function api(p, o = {}) {
    let token = localStorage.getItem('cultura_token');

    let r = await fetch('/api' + p, {
        ...o,
        headers: {
            'Content-Type': 'application/json',
            ...(o.headers || {}),
            ...(token ? { Authorization: 'Bearer ' + token } : {})
        }
    });

    let data;

    try {
        data = await r.json();
    } catch {
        throw new Error('Server returned an invalid response');
    }

    if (!r.ok) {
        throw new Error(data.error || `Request failed (${r.status})`);
    }

    return data;
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('cultura_theme',t);
  const icon=t==='dark'?'☀️':'🌙';
  const a=document.getElementById('themeToggle'),b=document.getElementById('themeToggleLogin');
  if(a)a.textContent=icon; if(b)b.textContent=icon;
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
applyTheme(localStorage.getItem('cultura_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function toast(s){toastEl=document.getElementById('toast');toastEl.textContent=s;toastEl.classList.remove('hidden');setTimeout(()=>toastEl.classList.add('hidden'),2500)}
async function boot(){if(!token)return;try{current=(await api('/auth/me')).user;openApp()}catch{}}
function setAuthTab(tab){
  const isLogin=tab==='login';
  tabLoginBtn.classList.toggle('active',isLogin);tabRegisterBtn.classList.toggle('active',!isLogin);
  loginForm.classList.toggle('hidden',!isLogin);registerForm.classList.toggle('hidden',isLogin);
}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{let x=await api('/auth/login',{method:'POST',body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});token=x.token;localStorage.setItem('cultura_token',token);current=x.user;openApp()}catch(e){alert(e.message)}};
document.getElementById('registerForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    if(regPassword.value!==regPassword2.value) throw Error('Passwords do not match.');
    let x=await api('/auth/register',{method:'POST',body:JSON.stringify({
      name:regName.value.trim(),father_name:regFather.value.trim(),mother_name:regMother.value.trim(),
      course_name:regCourse.value.trim(),gender:regGender.value,roll_number:regRoll.value.trim(),
      contact_number:regContact.value.trim(),email:regEmail.value.trim(),password:regPassword.value,dob:regDob.value
    })});
    token=x.token;localStorage.setItem('cultura_token',token);current=x.user;openApp();toast('Welcome to Cultura! Your account is ready.');
  }catch(e){alert(e.message)}
};
function logout(){token=null;current=null;localStorage.removeItem('cultura_token');app.classList.add('hidden');loginScreen.classList.remove('hidden')}
async function openApp(){loginScreen.classList.add('hidden');app.classList.remove('hidden');avatar.textContent=current.name[0];buildSidebar();showPage(current.role==='admin'?'admin':'home')}
function buildSidebar(){let common=`<button onclick="showPage('home')">🏠 Overview</button><button onclick="showPage('events')">📌 Competitions</button><button onclick="showPage('calendar')">📅 Calendar</button><button onclick="showPage('announcements')">📣 Announcements</button><button onclick="showPage('alumni')">🎓 Alumni</button><button onclick="showPage('profile')">👤 My Profile</button>`;
if(current.role==='admin')sidebar.innerHTML=`<div class="eyebrow">ADMIN CONTROL</div><button onclick="showPage('admin')">📊 Dashboard</button><button onclick="showPage('members')">👥 Members</button><button onclick="showPage('groups')">🎭 Groups</button><button onclick="showPage('attendance')">✅ Attendance</button>${common}`;
else sidebar.innerHTML=`<div class="eyebrow">MY PORTAL</div>${common}<div class="section"><div class="eyebrow">MY GROUPS</div>${(current.groups||[]).map(g=>`<button onclick="showPage('chat',${g.id})">💬 ${esc(g.name)}</button>`).join('')}</div>`}
async function showPage(p,arg){try{page=p; if(p==='admin')await adminPage();else if(p==='home')await homePage();else if(p==='members')await membersPage();else if(p==='groups')await groupsPage();else if(p==='attendance')await attendancePage();else if(p==='events')await eventsPage();else if(p==='calendar')await calendarPage();else if(p==='announcements')await announcementPage();else if(p==='alumni')await alumniPage();else if(p==='profile')await profilePage();else if(p==='chat')await chatPage(arg)}catch(e){toast(e.message)}}
async function homePage(){let [s,ev,an]=await Promise.all([api('/dashboard'),api('/competitions'),api('/announcements')]);main.innerHTML=`<div class="hero"><div class="eyebrow">${current.role==='admin'?'ADMIN DASHBOARD':'MEMBER PORTAL'}</div><h1>Hello, ${esc(current.name.split(' ')[0])} 👋</h1><p class="muted">Your cultural team, competitions, attendance, announcements and conversations in one place.</p></div><div class="grid"><div class="card stat"><strong>${s.membersOrGroups}</strong><span>${current.role==='admin'?'Members':'My Groups'}</span></div><div class="card stat"><strong>${s.competitions}</strong><span>Upcoming Competitions</span></div><div class="card stat"><strong>${s.attendance}</strong><span>${current.role==='admin'?'Attendance Records':'My Attendance Records'}</span></div></div><div class="section"><h2>📌 Upcoming Competitions</h2><div class="grid2">${eventsHtml(ev.slice(0,2))}</div></div><div class="section"><h2>📣 Announcements</h2>${an.slice(0,3).map(a=>`<div class="card notice"><b>${esc(a.title)}</b><div>${esc(a.text)}</div><small>${a.date}</small></div>`).join('')}</div>`}
function eventsHtml(a){
  return a.map(c=>`<div class="card event">
    ${c.image_url?`<img src="${esc(c.image_url)}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-bottom:12px">`:''}
    <div class="date">${esc(String(c.date||'').slice(5))}<br><small>${esc(c.time||'')}</small></div>
    <div style="flex:1">
      <h3>${esc(c.title)}</h3><p>${esc(c.description||'')}</p>
      <small>📍 ${esc(c.venue||'')}</small>
      <div style="margin-top:10px"><span class="pill">${esc(c.status||'upcoming')}</span> <span class="pill">${c.registration_count||0}${c.max_participants?'/'+c.max_participants:''} registered</span></div>
      ${c.registration_deadline?`<small>Registration deadline: ${esc(c.registration_deadline)}</small><br>`:''}
      ${c.attachment_url?`<a href="${esc(c.attachment_url)}" target="_blank" rel="noopener">📄 Competition document</a><br>`:''}
      ${current.role!=='admin'?(c.registered?`<button class="btn light" onclick="unregisterCompetition(${c.id})">Cancel registration</button>`:`<button class="btn accent" onclick="registerCompetition(${c.id})">Register</button>`):''}
      ${current.role==='admin'?`<button class="btn light" onclick="openCompetition(${c.id})">Edit</button> <button class="btn light" onclick="showParticipants(${c.id})">Participants</button> <button class="btn light" onclick="openResult(${c.id})">Result</button> <button class="btn danger" onclick="removeCompetition(${c.id})">Delete</button>`:''}
    </div>
  </div>`).join('')||'<div class="card">No competitions yet.</div>'
}
async function eventsPage(){let e=await api('/competitions');main.innerHTML=`<div class="hero"><div class="eyebrow">PIN BOARD</div><h1>Competitions</h1>${current.role==='admin'?'<button class="btn accent" onclick="openCompetition()">+ Add Competition</button>':''}</div><div class="grid2">${eventsHtml(e)}</div>`}
async function adminPage(){let s=await api('/dashboard');main.innerHTML=`<div class="hero"><div class="eyebrow">CONTROL CENTER</div><h1>Admin Dashboard</h1><p class="muted">You control members, groups, attendance, competitions, announcements and permissions.</p></div><div class="grid"><div class="card stat"><strong>${s.memberCount}</strong><span>Members</span></div><div class="card stat"><strong>${s.groupCount}</strong><span>Groups</span></div><div class="card stat"><strong>${s.attendance}</strong><span>Attendance Records</span></div></div><div class="section grid2"><div class="card"><h2>Quick actions</h2><button class="btn accent" onclick="openMember()">+ Add Member</button> <button class="btn" onclick="openGroup()">+ Add Group</button> <button class="btn light" onclick="openCompetition()">+ Competition</button></div><div class="card"><h2>Attendance overview</h2><p>Present: <b>${s.present}</b></p><p>Late: <b>${s.late}</b></p><p>Overall records: <b>${s.attendance}</b></p></div></div>`}
async function membersPage(){
  let u=await api('/members');

async function attendancePage(){
  const today=localDateISO();
  window.attendanceEdits={};
  main.innerHTML=`<div class="hero"><div class="eyebrow">ADMIN · DAILY OPERATIONS</div><h1>Attendance</h1><p class="muted">Mark each member present, late or absent individually for the selected date, then save.</p></div>
  <div class="card"><div class="toolbar"><label class="field" style="margin:0;min-width:180px">Date<input id="attDate" type="date" value="${today}" onchange="loadAttendance(true)"></label><input class="search" id="attSearch" placeholder="Search members…" oninput="filterAttendance()" style="max-width:260px"><div class="action-row"><button class="btn success sm" onclick="bulkAttendance('present')">✓ All Present</button><button class="btn warn sm" onclick="bulkAttendance('late')">◷ All Late</button><button class="btn danger sm" onclick="bulkAttendance('absent')">× All Absent</button></div></div><div id="attendanceContent" style="margin-top:16px"></div></div>`;
  await loadAttendance(true);
}
function localDateISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
async function loadAttendance(resetEdits){try{if(resetEdits)window.attendanceEdits={};const x=await api('/attendance?date='+attDate.value);window.attendanceData=x;renderAttendance();}catch(e){toast(e.message)}}
function renderAttendance(){
  const members=window.attendanceData?.members||[];
  if(!members.length){attendanceContent.innerHTML='<div class="notice">No members have been created yet.</div>';return}
  attendanceContent.innerHTML=`<div class="attendance-shell"><div class="att-toolbar"><div><h2 style="margin:0">All Members</h2><small class="muted">${attDate.value} · ${members.length} members</small></div><button class="btn accent" onclick="saveAttendance()">Save attendance</button></div><div id="attendanceRows" style="margin-top:8px">${members.map(u=>attendanceRow(u)).join('')}</div></div>`;
}
function attendanceRow(u){
  const st=(window.attendanceEdits&&window.attendanceEdits[u.id])||u.today||'present';
  const btn=(status,label)=>`<button class="att-btn ${st===status?'active '+status:''}" data-status="${status}" onclick="chooseAttendance(${u.id},'${status}')">${label}</button>`;
  return `<div class="att-row" data-att-user="${u.id}" data-status="${st}" data-search="${esc((u.name+' '+(u.roll_number||'')).toLowerCase())}"><div><b>${esc(u.name)}</b>${u.roll_number?`<br><small class="muted">${esc(u.roll_number)}</small>`:''}</div><div class="att-buttons">${btn('present','✓ Present')}${btn('late','◷ Late')}${btn('absent','× Absent')}</div><div class="percent"><span class="pill ${u.percent>=75?'green':u.percent>=50?'yellow':'red'}">${u.percent}%</span></div></div>`;
}
function chooseAttendance(uid,status){
  const row=document.querySelector(`[data-att-user="${uid}"]`);
  if(!row)return;
  row.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('active','present','late','absent'));
  const target=row.querySelector(`.att-btn[data-status="${status}"]`);
  if(target)target.classList.add('active',status);
  row.dataset.status=status;
  window.attendanceEdits=window.attendanceEdits||{};
  window.attendanceEdits[uid]=status;
}
function bulkAttendance(status){const members=window.attendanceData?.members||[];members.forEach(u=>chooseAttendance(u.id,status));toast(`Marked ${status} for ${members.length} members. Click Save attendance.`)}
function filterAttendance(){let q=(attSearch.value||'').toLowerCase();document.querySelectorAll('#attendanceRows [data-search]').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
async function saveAttendance(){
  const members=window.attendanceData?.members||[];
  if(!members.length)return;
  const rows=[...document.querySelectorAll('[data-att-user]')];
  const records=rows.map(r=>({user_id:+r.dataset.attUser,date:attDate.value,status:r.dataset.status||members.find(u=>u.id===+r.dataset.attUser)?.today||'present'}));
  try{
    await api('/attendance/bulk',{method:'POST',body:JSON.stringify({records})});
    toast('Attendance saved for all members');
    window.attendanceEdits={};
    await loadAttendance(false);
  }catch(e){toast(e.message)}
}

async function calendarPage(){
  const e=await api('/competitions');
  const startYear=new Date().getFullYear();
  const years=[startYear,startYear+1];
  const week=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthHtml=(year,month)=>{const first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=first.getDay();let cells='';for(let i=0;i<offset;i++)cells+='<div class="month-day empty"></div>';for(let d=1;d<=days;d++){const iso=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=e.filter(c=>String(c.date).slice(0,10)===iso);cells+=`<div class="month-day ${events.length?'has-event':''}" title="${events.map(c=>esc(c.title)).join(' · ')}"><b>${d}</b>${events.length?'<span class="event-dot"></span>':''}</div>`}return `<div class="month-card"><div class="month-title">${monthNames[month]}</div><div class="month-week">${week.map(x=>`<span>${x[0]}</span>`).join('')}${cells}</div></div>`};
  main.innerHTML=`<div class="hero"><div class="eyebrow">EVENTS · 24 MONTH VIEW</div><h1>Competition Calendar</h1><p class="muted">A complete two-year view so you can plan competitions without switching between months.</p><div class="calendar-legend"><span>● Competition scheduled</span><span>Today: ${localDateISO()}</span></div></div>${years.map(y=>`<section class="calendar-year"><h2>${y}<span class="pill">12 months</span></h2><div class="months-grid">${Array.from({length:12},(_,m)=>monthHtml(y,m)).join('')}</div></section>`).join('')}`;
}

async function saveAlumnus(id){
  try{
    const old=id?(await api('/alumni')).find(x=>x.id===id):null;
    const photo_path=await uploadPickedFile('alPhoto')||old?.photo_path||null;
    if(!alName.value.trim()) throw Error('Name is required.');
    await api(id?'/alumni/'+id:'/alumni',{method:id?'PUT':'POST',body:JSON.stringify({
      name:alName.value.trim(),course_name:alCourse.value.trim(),batch_year:alBatch.value.trim(),
      role_then:alRoleThen.value.trim(),current_work:alCurrent.value.trim(),bio:alBio.value.trim(),photo_path
    })});
    closeModal();toast(id?'Alumnus updated':'Alumnus added');showPage('alumni');
  }catch(e){toast(e.message)}
}

async function uploadDocument(type,inputId){
  const f=document.getElementById(inputId)?.files?.[0];
  if(!f)return toast('Choose a file first');
  try{
    const path=await uploadPickedFile(inputId);
    if(!path) return toast('Upload failed');
    await api('/profile/documents',{method:'POST',body:JSON.stringify({type,path})});
    toast('Document uploaded');
    profilePage();
  }catch(e){toast(e.message)}
}

    mDob.value=u.dob?String(u.dob).slice(0,10):'';

async function saveMember(id){
  let groups=[...mGroups.selectedOptions].map(o=>+o.value);
  await api(id?'/members/'+id:'/members',{method:id?'PUT':'POST',body:JSON.stringify({
    name:mName.value,email:mEmail.value,password:mPass.value,groups,
    father_name:mFather.value,mother_name:mMother.value,course_name:mCourse.value,
    gender:mGender.value,roll_number:mRoll.value,contact_number:mContact.value,dob:mDob.value||null
  })});
  closeModal();showPage('members');
}

async function downloadFile(path,filename){
  try{
    const token=localStorage.getItem('cultura_token');
    const r=await fetch('/api'+path,{headers:token?{Authorization:'Bearer '+token}:{}});
    if(!r.ok){let e={};try{e=await r.json()}catch(_){}throw Error(e.error||'Download failed')}
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){toast(e.message)}
}
async function downloadAllMemberDocuments(){downloadFile('/members/documents/export','cultura-all-member-documents.zip')}
async function downloadMemberDocuments(id,name){downloadFile('/members/'+id+'/documents/export',`${String(name||'member').replace(/[^a-zA-Z0-9 _-]/g,'').trim()||'member'}-documents.zip`)}
async function uploadPickedFile(inputId){
  const f=document.getElementById(inputId)?.files?.[0]; if(!f)return null;
  const fd=new FormData();fd.append('file',f);
  const r=await fetch(API+'/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
  const x=await r.json().catch(()=>({})); if(!r.ok)throw Error(x.error||'Upload failed'); return x.path;
}

  cStatus.value=item?.status||'upcoming';modal.classList.remove('hidden');

async function saveCompetition(id){
  try{const old=id?(await api('/competitions')).find(x=>x.id===id):null;const document_path=await uploadPickedFile('cFile')||old?.document_path||null;const image_path=await uploadPickedFile('cImage')||old?.image_path||null;if(!cTitle.value.trim()||!cDate.value)throw Error('Competition title and date are required.');await api(id?'/competitions/'+id:'/competitions',{method:id?'PUT':'POST',body:JSON.stringify({title:cTitle.value.trim(),date:cDate.value,time:cTime.value||null,venue:cVenue.value.trim(),description:cDesc.value.trim(),registration_deadline:cDeadline.value||null,max_participants:cMax.value?+cMax.value:null,status:cStatus.value,document_url:cDoc.value.trim(),document_path,image_path,result:old?.result||'',winner:old?.winner||''})});closeModal();toast(id?'Competition updated':'Competition published');showPage('events')}catch(e){toast(e.message)}}

  if(!confirm('Remove this participant from the competition?'))return;
